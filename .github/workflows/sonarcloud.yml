name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calidad-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Importante para análisis completos
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew
        working-directory: calidad-main

      # --------- INICIO DEL BLOQUE AGREGADO -----------
      - name: Compilar backend sin tests
        run: ./gradlew build -x test

      - name: Arrancar backend en segundo plano
        run: |
          ./gradlew bootRun &
          # Espera a que el backend esté escuchando en el puerto 8080
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "Backend is up!"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          nc -z localhost 8080 || (echo "Backend failed to start" && exit 1)
      # ---------- FIN DEL BLOQUE AGREGADO ----------

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar --info
